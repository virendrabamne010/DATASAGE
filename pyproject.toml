[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasage"
version = "1.0.0"
description = "Automated data analytics library for insights, visualizations, and reports"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Virendra Vijay Bamne", email = "virendrabamne@gmail.com"}
]
maintainers = [
    {name = "Virendra Vijay Bamne", email = "virendrabamne@gmail.com"}
]
keywords = ["data-analysis", "insights", "visualization", "reporting", "pandas", "data-cleaning", "data-profiling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pandas>=1.3.0,<3.0",
    "numpy>=1.21.0,<3.0",
    "matplotlib>=3.4.0,<4.0",
    "seaborn>=0.11.0,<1.0",
    "scipy>=1.7.0,<2.0",
    "reportlab>=3.6.0,<5.0",
    "openpyxl>=3.0.0,<4.0",
    "xlrd>=2.0.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.900",
    "isort>=5.0",
]
app = [
    "streamlit>=1.30.0",
    "altair>=5.0.0",
]
all = [
    "streamlit>=1.30.0",
    "altair>=5.0.0",
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.900",
    "isort>=5.0",
]

[project.urls]
Homepage = "https://github.com/virendravijaybamne/datasage"
Documentation = "https://github.com/virendravijaybamne/datasage#readme"
Repository = "https://github.com/virendravijaybamne/datasage"
Issues = "https://github.com/virendravijaybamne/datasage/issues"
Changelog = "https://github.com/virendravijaybamne/datasage/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = [
    "datasage",
    "datasage.cleaner",
    "datasage.core",
    "datasage.insights",
    "datasage.report",
    "datasage.visualization",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["datasage"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
